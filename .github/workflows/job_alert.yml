name: 4-Hour Job Tracker

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours. Hourly alternative: '7 * * * *' with AGG_BUDGET '6'
  workflow_dispatch:         # manual trigger button for testing

permissions:
  contents: write            # required so the bot can push seen_jobs.json (default token is read-only)

concurrency:
  group: job-tracker         # never let a manual run overlap a scheduled one
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Job Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AGG_BUDGET: '12'   # search-fallback queries per run (6 is enough for hourly runs)
        run: python main.py

      - name: Commit and Push Updated State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --cached --quiet || (git commit -m "auto: update seen jobs state [skip ci]" && git push)
